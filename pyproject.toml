[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "placas-alveolares"
version = "0.1.0"
description = "Aplicación de escritorio (PySide6) con arquitectura limpia."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pablo" }]
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "numpy>=2.0",
    "mapbox-earcut>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.380",
]

[project.scripts]
placas-alveolares = "placas_alveolares.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/placas_alveolares"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
exclude = ["**/__pycache__", "migrations", ".venv"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
